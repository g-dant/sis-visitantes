<div id="modalCadastroEmpresas" class="modal-bg">

  <div class="modal">

    <button
      type="button"
      class="modal-fechar"
      onclick="fecharModalCadastroEmpresas()"
      aria-label="Fechar"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

    <h2>Cadastro de Empresas</h2>

    <!-- Filtros e ações -->
    <div class="toolbar">

      <div class="toolbar-filtros">
        <input type="text" id="filtro-empresas" placeholder="Buscar empresa...">

	<select id="filtro-empresas-ativo">
	  <option value="">Todos</option>
          <option value="true">Ativos</option>
          <option value="false">Inativos</option>
        </select>

      </div>

      <button id="btn-nova-empresa" class="btn btn-primary"
	onclick="abrirModalNovaEmpresa()">
        <i class="fa-solid fa-building"></i>
        Nova empresa
      </button>

    </div>


    <!-- Tabela -->
    <div class="table-container">
      <table class="data-table">

        <thead>

          <tr>
            <th>Nome</th>
            <th>CNPJ</th>
            <th>Ativo</th>
            <th>Ações</th>
          </tr>

        </thead>

        <tbody id="empresas-tbody"></tbody>

      </table>
    </div>


    <!-- Paginação -->
    <div class="pagination-container">

      <div class="page-size">

        <label for="empresas-qtd-registros">
          Exibir:
        </label>

        <select id="empresas-qtd-registros">

          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="-1">Todos</option>

        </select>

      </div>

      <div class="pagination">
        <div id="empresas-pagination"class="pagination"></div>
      </div>

    </div>
  </div>
</div>
