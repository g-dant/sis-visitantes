<div id="modalCadastroVisitantes" class="modal-bg">

  <div class="modal modal-cadastro">

    <h2>Cadastro de visitantes</h2>
    <br/>

    <div class="tabela-container">

      <table class="tabela-cadastro">

        <thead>
          <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>RG</th>
            <th>E-mail</th>
            <th>Celular</th>
            <th>Empresa</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabela-cadastro-visitantes">
        </tbody>

      </table>

    </div>

    <div class="modal-actions">

      <button
        class="btn"
        onclick="fecharModalCadastroVisitantes()">
        Fechar
      </button>

    </div>

  </div>

</div>
