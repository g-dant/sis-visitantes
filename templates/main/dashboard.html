<div class="stats">

  <div class="stat stat-green">
    <h1 id="painel-autorizadas">0</h1>
    <hr>
    <div>Ativas</div>
  </div>

  <div class="stat stat-yellow">
    <h1 id="painel-pendentes">0</h1>
    <hr>
    <div>Pendentes</div>
  </div>

  <div class="stat stat-red">
    <h1 id="painel-revogadas">0</h1>
    <hr>
    <div>Revogadas</div>
  </div>

  <div class="stat stat-red">
    <h1 id="painel-expiradas">0</h1>
    <hr>
    <div>Expiradas</div>
  </div>

  <div class="stat">

    <h4>Cadastros:</h4>
    <br/>

    <button type="button" class="header-button" onclick="abrirModalCadastroVisitantes()">
      <i class="fa-solid fa-address-book"></i>
      Cadastro de visitantes
    </button>

    <button type="button" class="header-button" onclick="abrirModalCadastroEmpresas()">
      <i class="fa-solid fa-building"></i>
      Cadastro de empresas
    </button>

    <button type="button" class="header-button" onclick="abrirModalCadastroVeiculos()">
      <i class="fa-solid fa-car"></i>
      Cadastro de veículos
    </button>

  </div>

</div>

<div class="toolbar">
  <div class="toolbar-filtros">
    <input id="input-busca-texto" type="text" placeholder="Procurar...">
    
    <select id="select-status">
      <option>Todos Status</option>
    </select>

    <select id="select-setor">
      <option>Todos Setores</option>
    </select>

    <input type="date" id="input-data">
  </div>

  <div class="toolbar-acoes">
    {% if possui_permissao(usuario, "AUTORIZACAO_IMPORTAR") %}
    <button class="btn btn-primary" onclick="abrirModalImportacao()">
      <i class="fa-solid fa-file-import"></i>
      Importar Autorizações
    </button>
    {% endif %}
    {% if possui_permissao(usuario, "AUTORIZACAO_CRIAR") %}
    <button class="btn btn-primary" onclick="criarAutorizacao()">
      <i class="fa-solid fa-plus"></i>
      Nova Autorização
    </button>
    {% endif %}
  </div>
</div>
