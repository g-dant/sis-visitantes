<div id="modalCadastroVeiculos" class="modal-bg">

  <div class="modal">

    <button type="button" class="modal-fechar" 
      onclick="fecharModalCadastroVeiculos()" aria-label="Fechar">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <h2>Cadastro de Veículos</h2>

    <!-- Filtros e ações -->
    <div class="toolbar">

      <div class="toolbar-filtros">

        <input type="text" id="filtro-veiculos" placeholder="Buscar veículo...">

        <select id="filtro-veiculos-ativo">
          <option value="">Todos</option>
          <option value="true">Ativos</option>
          <option value="false">Inativos</option>
        </select>

      </div>

      {% if possui_permissao(usuario, "VEICULO_CRIAR") %}
      <button id="btn-novo-veiculo" class="btn btn-primary"
        onclick="abrirModalNovoVeiculo()">
        <i class="fa-solid fa-car"></i>
        Novo veículo
      </button>
      {% endif %}

    </div>

    <!-- Tabela -->
    <div class="table-container">

      <table class="data-table">

        <thead>

          <tr>
            <th>Placa</th>
            <th>Marca</th>
            <th>Cor</th>
            <th>Tipo</th>
            <th>Ativo</th>
            <th>Ações</th>
          </tr>

        </thead>

        <tbody id="veiculos-tbody"></tbody>

      </table>

    </div>

    <!-- Paginação -->
    <div class="pagination-container">

      <div class="page-size">

        <label for="veiculos-qtd-registros">
          Exibir:
        </label>

        <select id="veiculos-qtd-registros">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="-1">Todos</option>
        </select>

      </div>

      <div class="pagination">
        <div id="veiculos-pagination" class="pagination"></div>
      </div>

    </div>
  </div>
</div>
