<div id="modalVisitantes" class="modal-bg">
  <div class="modal">

    <h2>Autorização</h2>

    <!-- LABEL COM STATUS DE AUTORIZAÇÃO EXIBIDO APÓS LEITURA DO QRCODE -->
    <div 
      id="status-autorizacao-destaque"
      class="status-autorizacao-destaque"
      style="display:none;">
    STATUS:&nbsp;<span id="status-autorizacao-texto"></span>

</div>

    <hr>

    <div class="form-grid">

      <div>
        <label>CPF</label>
        <div class="input-com-botao">
          <input type="text" id="visitante-cpf">
          <button type="button" id="btn-buscar-visitante" class="btn btn-primary" onclick="buscarVisitantePorCpf()">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <div id="status-visitante" class="status-cadastro" style="display:none;"></div>
      </div>

      <div>
        <label>RG</label>
        <div class="input-com-botao">
          <input type="text" id="visitante-rg">
          <button type="button" id="btn-buscar-rg" class="btn btn-primary">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>

      <div class="full">
        <label>Nome</label>
        <input type="text" id="visitante-nome">
      </div>

      <div>
        <label>E-Mail</label>
        <input type="email" id="visitante-email">
      </div>

      <div>
        <label>Celular</label>
        <input type="text" id="visitante-celular" value="+55 ">
      </div>

      <div class="full">
        <label>Empresa</label>
        <div class="input-com-botao">
          <input type="text" id="empresa-nome" autocomplete="off" placeholder="Digite a empresa">
          <button id="btn-adicionar-empresa" type="button" class="btn btn-primary" onclick="openNovaEmpresaModal()">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
        <div id="empresa-sugestoes" class="autocomplete-lista"></div>

      </div>

    </div>

    <hr>

    <div class="form-grid">

      <div>
        <label>Placa</label>
        <div class="input-com-botao">
          <input type="text" id="veiculo-placa">
          <button type="button" id="btn-buscar-veiculo" class="btn btn-primary" onclick="buscarVeiculoPorPlaca()">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <div id="status-veiculo" class="status-cadastro" style="display:none;"></div>
      </div>

      <div>
        <label>Marca</label>
        <input type="text" id="veiculo-marca">
      </div>

      <div>
        <label>Cor</label>
        <input type="text" id="veiculo-cor">
      </div>

      <div>
        <label>Tipo</label>
        <input type="text" id="veiculo-tipo">
      </div>

      <div class="full">
        <label>Observações do Veículo</label>
        <textarea id="veiculo-observacoes" rows="3"></textarea>
      </div>

    </div>

    <hr>

    <div class="form-grid">

      <div class="full">
        <label>Setor Solicitante</label>
        <input type="text" id="setor-solicitante" readonly class="campo-readonly">
      </div>

      <div>
        <label>Primeiro Dia</label>
        <input type="date" id="primeiro-dia">
      </div>

      <div>
        <label>Último Dia</label>
        <input type="date" id="ultimo-dia">
      </div>

    </div>

    <div id="qrcode-autorizacao" class="qrcode-container">
      <hr>
      <h3>QR Code</h3>

      <button id="btn-gerar-qrcode" class="btn" onclick="visualizarQrCode()">
        <i class="fa-solid fa-qrcode"></i>Visualizar QR Code
      </button>

      <p class="qrcode-info">Apresente este QR Code na portaria.</p>

    </div>

    <div id="historico-autorizacao" style="display:none;">
      <hr>
      <h3>Histórico</h3>
      <div id="historico-conteudo"></div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button class="btn" onclick="closeModalVisitantes()">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar-autorizacao">Salvar</button>
    </div>

  </div>
</div>
