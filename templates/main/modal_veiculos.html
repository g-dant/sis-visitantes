<div id="modalCadastroVeiculos" class="modal-bg">

  <div class="modal modal-cadastro">

    <h2>Cadastro de veículos</h2>
    <br/>

    <div class="tabela-container">

      <table class="tabela-cadastro">

        <thead>
          <tr>
            <th>Placa</th>
            <th>Marca</th>
            <th>Tipo</th>
            <th>Cor</th>
            <th>Observações</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabela-cadastro-veiculos">
        </tbody>

      </table>

    </div>

    <div class="modal-actions">

      <button
        class="btn"
        onclick="fecharModalCadastroVeiculos()">
        Fechar
      </button>

    </div>

  </div>

</div>
